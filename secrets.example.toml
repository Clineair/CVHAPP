# Placeholders only. Paste real values into Streamlit Cloud secrets, not into git.
# Generate each PIN hash with: python tools/make_pin_hash.py --employee "Carl Mulvaney"
# Generate cookie_secret with: python -c "import secrets; print(secrets.token_urlsafe(32))"
# Employee keys match [timesheet_employees] and [timesheet_employee_mail].
# Add a [timesheet_pins] hash for each time-sheet employee, including Ron Cline.

[timesheet_pin]
cookie_secret = "replace-with-a-long-random-string"

[timesheet_pins]
"Ron Cline" = "scrypt$16384$8$1$REPLACE_SALT$REPLACE_HASH"
"Carl Mulvaney" = "scrypt$16384$8$1$REPLACE_SALT$REPLACE_HASH"
"Anthony Root" = "scrypt$16384$8$1$REPLACE_SALT$REPLACE_HASH"
"Barry Markham" = "scrypt$16384$8$1$REPLACE_SALT$REPLACE_HASH"
"Robert Rackley" = "scrypt$16384$8$1$REPLACE_SALT$REPLACE_HASH"
"Gary Grant" = "scrypt$16384$8$1$REPLACE_SALT$REPLACE_HASH"
"Skylar Fingerle" = "scrypt$16384$8$1$REPLACE_SALT$REPLACE_HASH"
# Office PIN user (no time sheet). Opens EMPLOYEES -> Receipts summary.
"Patti" = "scrypt$16384$8$1$REPLACE_SALT$REPLACE_HASH"

# [auth] may stay in Streamlit secrets from the old Google sign-in setup.
# The app does not read it to open a time sheet and does not call st.login.

# Company mailbox. Sending stays off until enabled = true.
# Default backend is gmail_smtp. smtp and graph remain available.
# sender overrides the From address. If sender is omitted, From is clineair891@gmail.com.
# Do not commit the app password or client secret.
[timesheet_company_mail]
enabled = false
backend = "gmail_smtp"
sender = "clineair891@gmail.com"
username = "clineair891@gmail.com"
password = "replace-with-gmail-app-password"
tenant_id = "replace-with-entra-tenant-id"
client_id = "replace-with-app-client-id"
client_secret = "replace-with-app-client-secret"

# Optional Reply-To. Same employee keys as [timesheet_pins].
# [timesheet_employee_mail] is used first. [timesheet_employees] is the fallback.
# [timesheet_mail].recipient overrides the To address when set.

# Bulletins Live Two bulletin PDFs are uploaded by a Google Apps Script web
# app that runs as clineair891, so files use that account's Drive quota.
# Deploy apps_script/blt_upload and set Script Properties UPLOAD_TOKEN and
# FOLDER_ID there. Then set these Streamlit secrets (do not commit real values).
[blt_checks]
apps_script_url = "https://script.google.com/macros/s/replace-with-deployment-id/exec"
upload_token = "replace-with-the-same-value-as-the-script-property-UPLOAD_TOKEN"

# Employee receipt photos are uploaded by a separate Apps Script web app
# (apps_script/receipt_upload) that runs as clineair891, one Drive subfolder
# per employee. Set Script Properties UPLOAD_TOKEN and RECEIPTS_FOLDER_ID there.
# Until these are set, receipts still save but the photo is NOT kept on Drive.
[receipts]
apps_script_url = "https://script.google.com/macros/s/replace-with-deployment-id/exec"
upload_token = "replace-with-the-same-value-as-the-script-property-UPLOAD_TOKEN"

# Receipts summary to Patti uses the [timesheet_company_mail] mailbox and app password.
# auto_send stays false until Ron approves the bi-weekly automatic email.
# recipient is optional; the default is the timesheet recipient (Patti).
# Optional in-flight speech-to-text for BNSF "Not sprayed (voice)".
# Leave this out (or enabled = false) and the pilot uses the iPhone keyboard
# microphone in the reason box. Time and the GPS milepost are still captured.
# url and model are optional. The default is OpenAI Whisper.
# Do not commit a real api_key.
# [bnsf_speech]
# enabled = false
# api_key = "replace-with-openai-api-key"
# url = "https://api.openai.com/v1/audio/transcriptions"
# model = "whisper-1"

[receipts_mail]
auto_send = false
