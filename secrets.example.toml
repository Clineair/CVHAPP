# [auth] may stay in Streamlit secrets from the old Google sign-in setup.
# The app does not read it to open a time sheet and does not call st.login.

# Company mailbox. Sending stays off until enabled = true.
# Default backend is gmail_smtp. smtp and graph remain available.
# sender overrides the From address. If sender is omitted, From is clineair891@gmail.com.
# Do not commit the app password or client secret.
[timesheet_company_mail]
enabled = false
backend = "gmail_smtp"
sender = "clineair891@gmail.com"
username = "clineair891@gmail.com"
password = "replace-with-gmail-app-password"
tenant_id = "replace-with-entra-tenant-id"
client_id = "replace-with-app-client-id"
client_secret = "replace-with-app-client-secret"

# Optional Reply-To. Same employee keys as [timesheet_pins].
# [timesheet_employee_mail] is used first. [timesheet_employees] is the fallback.
# [timesheet_mail].recipient overrides the To address when set.
