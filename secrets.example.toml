# Placeholders only. Paste real values into Streamlit Cloud secrets, not into git.
# Generate each PIN hash with: python tools/make_pin_hash.py --employee "Carl Mulvaney"
# Generate cookie_secret with: python -c "import secrets; print(secrets.token_urlsafe(32))"
# Employee keys match [timesheet_employees] and [timesheet_employee_mail].
# Ron Cline has no time sheet and no PIN.

[timesheet_pin]
cookie_secret = "replace-with-a-long-random-string"

[timesheet_pins]
"Carl Mulvaney" = "scrypt$16384$8$1$REPLACE_SALT$REPLACE_HASH"
"Anthony Root" = "scrypt$16384$8$1$REPLACE_SALT$REPLACE_HASH"
"Barry Markham" = "scrypt$16384$8$1$REPLACE_SALT$REPLACE_HASH"
"Robert Rackley" = "scrypt$16384$8$1$REPLACE_SALT$REPLACE_HASH"
"Gary Grant" = "scrypt$16384$8$1$REPLACE_SALT$REPLACE_HASH"
"Skylar Fingerle" = "scrypt$16384$8$1$REPLACE_SALT$REPLACE_HASH"

# [auth] may stay in Streamlit secrets from the old Google sign-in setup.
# The app does not read it to open a time sheet and does not call st.login.

# Company mailbox. Sending stays off until enabled = true.
# Use backend = "smtp" or backend = "graph", and fill only that backend's keys.
# From is always cvh@centralvalleyheli.com. Do not commit the password or client secret.
[timesheet_company_mail]
enabled = false
backend = "smtp"
sender = "cvh@centralvalleyheli.com"
username = "cvh@centralvalleyheli.com"
password = "replace-with-mailbox-password"
tenant_id = "replace-with-entra-tenant-id"
client_id = "replace-with-app-client-id"
client_secret = "replace-with-app-client-secret"

# Optional Reply-To. Same employee keys as [timesheet_pins].
# [timesheet_employee_mail] is used first. [timesheet_employees] is the fallback.
# [timesheet_mail].recipient overrides the To address when set.
